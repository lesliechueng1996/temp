[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700
chown=root:root

[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
autoshutdown=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=127.0.0.1:9001

[program:app]
command=./server
directory=/workspace
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/ubuntu",LOG_LEVEL="%(ENV_LOG_LEVEL)s",SUPERVISOR_HOST="%(ENV_SUPERVISOR_HOST)s",SUPERVISOR_PORT="%(ENV_SUPERVISOR_PORT)s",SERVER_TIMEOUT_MINUTES="%(ENV_SERVER_TIMEOUT_MINUTES)s"
priority=60

[group:services]
programs=app